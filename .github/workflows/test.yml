name: Test

on:
  push:
    branches: [main, master, 'refactor/**']
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Lint + Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check (JSDoc + // @ts-check)
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Check KV setup preserves existing bindings
        run: npm run check:setup

      - name: Check UI asynchronous state handling
        run: npm run check:ui

      - name: Check built storage adapters
        run: npm run check:storage

      - name: Smoke test Node server and static assets
        run: node scripts/check-server.mjs

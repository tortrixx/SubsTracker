<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>活动 - 订阅管理系统</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  ${themeResources}
  <style>
    /* 活动页本地布局（只引用主题层 tokens，不写颜色/时长字面量） */
    .act-wrap { max-width: 1080px; margin: 0 auto; padding: var(--sp-5) var(--sp-4) var(--sp-6); }
    @media (max-width: 767px) { .act-wrap { padding: var(--sp-4) var(--sp-3) var(--sp-5); } }
    .act-head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--sp-3); margin-bottom: var(--sp-4); }
    .act-title { font-size: var(--fs-2xl); font-weight: 800; letter-spacing: -0.01em; color: var(--text-main); display: flex; align-items: center; gap: var(--sp-2); }
    .act-title i { color: var(--accent); font-size: var(--fs-xl); }
    .act-card {
      background: var(--surface); border: 1px solid var(--hairline);
      border-radius: var(--radius-l); box-shadow: var(--sh-card);
      padding: var(--sp-4); margin-bottom: var(--sp-4);
    }
    .act-filter-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); margin-bottom: var(--sp-3); }
    .act-filter-row:last-child { margin-bottom: 0; }
    .act-flabel { flex: none; min-width: 44px; font-size: var(--fs-sm); font-weight: 600; color: var(--text-muted); }
    .act-sub-select { width: auto; min-width: 180px; max-width: 100%; }
    .act-seg-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--sp-3); margin-bottom: var(--sp-3); }
    .act-item { display: flex; flex-direction: column; gap: var(--sp-2); }
    .act-detail {
      background: var(--surface); border: 1px solid var(--hairline);
      border-radius: var(--radius-l); box-shadow: var(--sh-card);
      padding: var(--sp-4);
      animation: st-fade-in var(--dur) ease both;
    }
    .act-dlabel { font-size: var(--fs-xs); font-weight: 700; color: var(--text-muted); margin: var(--sp-3) 0 var(--sp-1); }
    .act-dlabel:first-child { margin-top: 0; }
    .act-pre {
      white-space: pre-wrap; word-break: break-word;
      max-height: 38vh; overflow: auto;
      font-size: var(--fs-sm); line-height: 1.6; color: var(--text-main);
      background: var(--surface-tint); border: 1px solid var(--hairline);
      border-radius: var(--radius-m); padding: var(--sp-3);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .act-pre--error { color: var(--tone-danger-text); }
    .act-detail-actions { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-top: var(--sp-4); }
    .act-detail-actions a { text-decoration: none; }
    .act-title-line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .act-chev { transition: transform var(--dur-fast) var(--ease); }
    .act-chev-open { transform: rotate(180deg); }
    .act-more { text-align: center; padding: var(--sp-4) 0 var(--sp-2); display: flex; flex-direction: column; align-items: center; gap: var(--sp-2); }
    .act-banner { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; }
    .act-banner[hidden] { display: none; }
    .act-banner-text { flex: 1; min-width: 200px; }
    .act-cand { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); padding: var(--sp-2) 0; border-bottom: 1px solid var(--hairline); }
    .act-cand:last-child { border-bottom: none; }
    .act-cand-name { font-weight: 600; color: var(--text-main); font-size: var(--fs-sm); }
    .act-cand-meta { font-size: var(--fs-sm); color: var(--text-muted); }
    .act-run-banner { margin-bottom: var(--sp-3); }
    .act-skel-stack { display: flex; flex-direction: column; gap: var(--sp-2); }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">
  <div id="st-shell" data-active="activity"></div>
  <main class="st-main">
    <div class="act-wrap">
      <div class="act-head">
        <h1 class="act-title"><i class="fas fa-history"></i>活动</h1>
        <button type="button" id="reloadBtn" class="st-btn st-btn--ghost st-btn--sm">
          <i class="fas fa-sync"></i>刷新
        </button>
      </div>

      <!-- 时区门禁骨架：config 就绪前显示，就绪后由 ST 自动切换 -->
      <div class="st-gate-skel">
        <div class="act-skel-stack">
          <div class="st-skel st-skel--strip"></div>
          <div class="st-skel st-skel--card"></div>
          <div class="st-skel st-skel--row"></div>
          <div class="st-skel st-skel--row"></div>
          <div class="st-skel st-skel--row"></div>
        </div>
      </div>

      <div class="st-tz-content">
        <div class="act-seg-row">
          <div class="st-seg" role="tablist" aria-label="记录类型">
            <button type="button" class="st-seg-btn is-active" data-seg="send" role="tab" aria-selected="true">发送记录</button>
            <button type="button" class="st-seg-btn" data-seg="sched" role="tab" aria-selected="false">调度记录</button>
          </div>
          <span class="st-caption">发送与调度记录保留 30 天 · 时间按配置时区 <span id="tzName"></span> 显示</span>
        </div>

        <!-- ══════════ 发送记录段 ══════════ -->
        <section id="paneSend">
          <div class="act-card">
            <div id="runBanner" class="st-alert st-alert--info act-banner act-run-banner" hidden>
              <span class="act-banner-text" id="runBannerText"></span>
              <button type="button" class="st-btn st-btn--ghost st-btn--sm" id="runBannerClear">清除</button>
            </div>
            <div class="act-filter-row">
              <span class="act-flabel">渠道</span>
              <div class="st-chips" id="channelChips"></div>
            </div>
            <div class="act-filter-row">
              <span class="act-flabel">状态</span>
              <div class="st-chips" id="statusChips">
                <button type="button" class="st-fchip is-active" data-status="">全部</button>
                <button type="button" class="st-fchip" data-status="success">成功</button>
                <button type="button" class="st-fchip" data-status="failed">失败</button>
                <button type="button" class="st-fchip" data-status="test">测试</button>
              </div>
            </div>
            <div class="act-filter-row">
              <span class="act-flabel">订阅</span>
              <select id="filterSub" class="st-input act-sub-select" aria-label="按订阅筛选">
                <option value="">全部订阅</option>
              </select>
            </div>
            <div class="act-filter-row">
              <span class="act-flabel">时间</span>
              <div class="st-seg" id="rangeSeg">
                <button type="button" class="st-seg-btn" data-range="7d">近 7 天</button>
                <button type="button" class="st-seg-btn is-active" data-range="30d">近 30 天</button>
                <button type="button" class="st-seg-btn" data-range="all">全部</button>
              </div>
              <span class="st-caption">记录保留 30 天，「全部」即保留期内的全部记录</span>
            </div>
          </div>

          <p class="st-caption" id="sendSummary" style="margin-bottom: var(--sp-3);"></p>
          <div id="sendList" class="st-row-list"></div>
          <div id="sendEmpty" style="margin-top: var(--sp-3);"></div>
          <div class="act-more" id="sendMore"></div>
          <div id="sendSentinel"></div>
        </section>

        <!-- ══════════ 调度记录段 ══════════ -->
        <section id="paneSched" hidden>
          <p class="st-caption" style="margin-bottom: var(--sp-3);">
            调度器按小时检查到期订阅并按规则发送提醒；结论口径与侧边栏状态点同源。展开可看每次命中的订阅、规则与各渠道结果。
          </p>
          <p class="st-caption" id="schedSummary" style="margin-bottom: var(--sp-3);"></p>
          <div id="schedList" class="st-row-list"></div>
          <div id="schedEmpty" style="margin-top: var(--sp-3);"></div>
          <div class="act-more" id="schedMore"></div>
          <div id="schedSentinel"></div>
        </section>
      </div>
    </div>
  </main>

  <script>
  (function () {
    'use strict';

    var SEND_PAGE = 50;      // 发送段每页（递增 limit 重拉，无 offset 接口）
    var SCHED_PAGE = 20;     // 调度段每页
    var SEND_MAX = 500;      // /api/notification-logs 的 limit 上限
    var SCHED_MAX = 200;     // /api/scheduler-logs 的 limit 上限
    var CHANNEL_TEST_SUB = 'channel-test';

    var qs = new URLSearchParams(location.search);

    /* ───────── 基础状态 ───────── */
    var subMap = {};         // subId -> { id, name }
    var rulesCache = {};     // subId -> { status: 'loading'|'done'|'error', byId: { ruleId: rule } }

    var send = {
      channels: {},          // 选中的渠道名集合（空 = 全部）
      status: '',            // '' | 'success' | 'failed' | 'test'
      subId: '',
      range: '30d',          // '7d' | '30d' | 'all'
      rule: '',              // 深链 ?rule= 的客户端规则筛选
      runWindow: null,       // { since, until, label } 调度互链的时间窗筛选
      limit: SEND_PAGE,
      items: [],             // 服务端返回（未过客户端筛选）
      visible: [],           // 客户端筛选后
      hasMore: false,
      loading: false,
      loaded: false,
      error: null,
      everAny: null          // 保留期内是否曾有任何发送记录（区分真空/筛选空）
    };
    var expandedSend = {};   // log.key -> true

    var sched = {
      limit: SCHED_PAGE,
      items: [],
      hasMore: false,
      loading: false,
      loaded: false,
      error: null
    };
    var expandedSched = {};  // entry.key -> true
    var activeSeg = 'send';

    /* ───────── DOM 引用 ───────── */
    function $(id) { return document.getElementById(id); }
    var els = {
      sendList: $('sendList'), sendEmpty: $('sendEmpty'), sendMore: $('sendMore'),
      sendSummary: $('sendSummary'), schedList: $('schedList'), schedEmpty: $('schedEmpty'),
      schedMore: $('schedMore'), schedSummary: $('schedSummary'),
      channelChips: $('channelChips'), statusChips: $('statusChips'),
      filterSub: $('filterSub'), rangeSeg: $('rangeSeg'),
      runBanner: $('runBanner'), runBannerText: $('runBannerText'),
      paneSend: $('paneSend'), paneSched: $('paneSched')
    };

    /* ───────── 通用工具 ───────── */
    function apiGet(path) {
      return fetch(path, { credentials: 'same-origin' }).then(function (r) {
        if (!r.ok) throw new Error('请求失败（HTTP ' + r.status + '）');
        return r.json();
      });
    }
    function num(v) { var n = Number(v); return isNaN(n) ? 0 : n; }
    function channelDef(name) {
      for (var i = 0; i < ST.CHANNELS.length; i++) if (ST.CHANNELS[i].name === name) return ST.CHANNELS[i];
      return null;
    }
    function channelBadge(name) {
      var def = channelDef(name);
      var icon = def ? def.icon : 'fa-bell';
      return '<span class="st-badge st-neutral"><i class="fas ' + ST.esc(icon) + '"></i>&nbsp;' + ST.esc(ST.channelLabel(name)) + '</span>';
    }
    function statusBadge(l) {
      return l.status === 'failed' ? ST.badge('danger', '失败') : ST.badge('ok', '成功');
    }

    /* ───────── 订阅与规则（规则摘要的数据基础） ───────── */
    function loadSubs() {
      return apiGet('/api/subscriptions').then(function (list) {
        if (!Array.isArray(list)) return;
        list.forEach(function (s) { if (s && s.id) subMap[s.id] = s; });
        var sel = els.filterSub;
        list.forEach(function (s) {
          if (!s || !s.id) return;
          var opt = document.createElement('option');
          opt.value = s.id;
          opt.textContent = s.name || s.id;
          sel.appendChild(opt);
        });
        // 深链指向已删除订阅：补一个通用文案选项（不显示 UUID 于文本）
        if (send.subId && !subMap[send.subId]) {
          var ghost = document.createElement('option');
          ghost.value = send.subId;
          ghost.textContent = '已删除的订阅';
          sel.appendChild(ghost);
        }
        sel.value = send.subId || '';
      }).catch(function () { /* 订阅列表失败不阻塞日志：名称回退为「已删除的订阅」 */ });
    }

    function ensureRules(subId) {
      if (!subId || subId === CHANNEL_TEST_SUB || rulesCache[subId]) return;
      if (!subMap[subId]) return; // 已删除订阅无规则可查
      rulesCache[subId] = { status: 'loading', byId: {} };
      apiGet('/api/subscriptions/' + encodeURIComponent(subId) + '/reminders').then(function (j) {
        var byId = {};
        ((j && j.rules) || []).forEach(function (r) { if (r && r.id) byId[r.id] = r; });
        rulesCache[subId] = { status: 'done', byId: byId };
      }).catch(function () {
        rulesCache[subId] = { status: 'error', byId: {} };
      }).then(function () { patchRuleCells(); });
    }
    function ensureRulesForLogs(logs) {
      var seen = {};
      logs.forEach(function (l) { if (!seen[l.subId]) { seen[l.subId] = 1; ensureRules(l.subId); } });
    }
    /* 规则加载完成后就地回填摘要单元格，避免整表重渲 */
    function patchRuleCells() {
      var cells = document.querySelectorAll('[data-rulecell]');
      for (var i = 0; i < cells.length; i++) {
        var key = cells[i].getAttribute('data-rulecell');
        var log = findSendLog(key);
        if (log) cells[i].textContent = ruleSummaryFor(log);
      }
      var ccells = document.querySelectorAll('[data-candrule]');
      for (var j = 0; j < ccells.length; j++) {
        var parts = ccells[j].getAttribute('data-candrule').split('|');
        ccells[j].textContent = candidateRuleSummary({ subId: parts[0], ruleId: parts[1], ruleType: parts[2], ruleValue: Number(parts[3]) });
      }
    }
    function findSendLog(key) {
      for (var i = 0; i < send.items.length; i++) if (send.items[i].key === key) return send.items[i];
      return null;
    }

    function ruleSummaryFor(log) {
      var rid = log.ruleId;
      if (rid === 'test') return '渠道测试';
      if (rid === 'manual-test') return '手动测试';
      if (rid === 'thirdparty') return '第三方 API 触发';
      if (!rid || rid === 'none' || rid === 'null') return '未设置';
      if (log.subId === CHANNEL_TEST_SUB) return '渠道测试';
      if (!subMap[log.subId]) return '订阅已删除';
      var c = rulesCache[log.subId];
      if (!c || c.status === 'loading') return '加载中…';
      if (c.status === 'error') return '提醒规则';
      var r = c.byId[rid];
      return r ? ST.ruleSummary(r) : '规则已删除';
    }
    function candidateRuleSummary(c) {
      var cache = rulesCache[c.subId];
      if (cache && cache.status === 'done' && cache.byId[c.ruleId]) return ST.ruleSummary(cache.byId[c.ruleId]);
      // extra.candidates 不带 unit/repeatInterval：以天为单位近似，精确值以规则缓存为准
      return ST.ruleSummary({ type: c.ruleType, value: c.ruleValue, unit: 'days' });
    }
    function subNameFor(log) {
      if (log.subId === CHANNEL_TEST_SUB) return '渠道测试';
      var s = subMap[log.subId];
      return s ? (s.name || '已删除的订阅') : '已删除的订阅';
    }

    /* ───────── 发送段：查询与筛选 ───────── */
    function rangeLabel() {
      if (send.runWindow) return send.runWindow.label;
      if (send.range === '7d') return '近 7 天';
      if (send.range === '30d') return '近 30 天';
      return '全部（保留期内）';
    }
    function buildSendParams(limit) {
      var p = new URLSearchParams();
      p.set('limit', String(limit));
      if (send.runWindow) {
        p.set('since', send.runWindow.since);
        p.set('until', send.runWindow.until);
      } else if (send.range !== 'all') {
        var days = send.range === '7d' ? 7 : 30;
        p.set('since', new Date(Date.now() - days * 86400000).toISOString());
      }
      if (send.subId) p.set('subId', send.subId);
      if (send.status === 'success' || send.status === 'failed') p.set('status', send.status);
      var chs = Object.keys(send.channels);
      if (chs.length === 1) p.set('channel', chs[0]);
      return p;
    }
    function applyClientFilters(logs) {
      var chs = Object.keys(send.channels);
      return logs.filter(function (l) {
        if (chs.length && chs.indexOf(l.channel) < 0) return false;
        if (send.status === 'test' && l.ruleId !== 'test') return false;
        if (send.rule && l.ruleId !== send.rule) return false;
        return true;
      });
    }
    function hasActiveSendFilters() {
      return Object.keys(send.channels).length > 0 || !!send.status || !!send.subId ||
        send.range !== '30d' || !!send.rule || !!send.runWindow;
    }

    function loadSend(reset) {
      if (send.loading) return Promise.resolve();
      if (reset) { send.limit = SEND_PAGE; send.loaded = false; }
      send.loading = true;
      renderSend();
      var lim = send.limit;
      return apiGet('/api/notification-logs?' + buildSendParams(lim).toString()).then(function (j) {
        var logs = (j && j.logs) || [];
        send.items = logs;
        send.visible = applyClientFilters(logs);
        send.hasMore = logs.length >= lim && lim < SEND_MAX;
        send.loaded = true;
        send.error = null;
        ensureRulesForLogs(send.visible);
      }).catch(function (e) {
        send.error = e;
        send.loaded = true;
      }).then(function () {
        send.loading = false;
        renderSend();
      });
    }
    function loadMoreSend() {
      if (send.loading || !send.hasMore) return;
      send.limit = Math.min(SEND_MAX, send.limit + SEND_PAGE);
      loadSend(false);
    }

    /* ───────── 发送段：渲染 ───────── */
    function preBlock(label, text, isError) {
      if (text === null || text === undefined || text === '') return '';
      return '<div class="act-dlabel">' + ST.esc(label) + '</div>' +
        '<pre class="act-pre' + (isError ? ' act-pre--error' : '') + '">' + ST.esc(String(text)) + '</pre>';
    }
    function sendDetailHtml(l) {
      var h = '<div class="act-detail" data-detail="' + ST.esc(l.key) + '">';
      h += preBlock('标题', l.title || '');
      h += preBlock('正文', l.content || '');
      h += preBlock('错误', l.error || '', true);
      if (l.raw !== null && l.raw !== undefined && l.raw !== '') {
        var rawText = typeof l.raw === 'string' ? l.raw : JSON.stringify(l.raw, null, 2);
        h += preBlock('原始返回', rawText || '');
      }
      if (!l.title && !l.content && !l.error && (l.raw === null || l.raw === undefined || l.raw === '')) {
        h += '<div class="st-caption">无更多详情</div>';
      }
      h += '<div class="act-dlabel">时间</div><div class="st-caption">' +
        ST.esc(ST.fmtDateTimeInTz(l.timestamp)) + '（' + ST.esc(ST.tz()) + '）</div>';
      var actions = '';
      if (subMap[l.subId]) {
        actions += '<a class="st-btn st-btn--ghost st-btn--sm" href="/admin?focus=' + encodeURIComponent(l.subId) + '">查看该订阅</a>';
      }
      if (l.status === 'failed' && l.channel) {
        actions += '<a class="st-btn st-btn--ghost st-btn--sm" href="/admin/channels?open=' + encodeURIComponent(l.channel) + '">去修复</a>';
      }
      if (actions) h += '<div class="act-detail-actions">' + actions + '</div>';
      h += '</div>';
      return h;
    }
    function sendRowHtml(l) {
      var isTest = l.ruleId === 'test';
      var open = !!expandedSend[l.key];
      var h = '<div class="act-item">';
      h += '<div class="st-row"><div class="st-row-main">';
      h += '<div class="st-row-title">' + ST.esc(subNameFor(l)) + (isTest ? ' ' + ST.badge('info', '测试') : '') + '</div>';
      h += '<div class="st-row-meta">' + ST.esc(ST.fmtDateTimeInTz(l.timestamp)) + ' · ' + channelBadge(l.channel) +
        ' · <span data-rulecell="' + ST.esc(l.key) + '">' + ST.esc(ruleSummaryFor(l)) + '</span></div>';
      if (l.title) h += '<div class="st-row-meta act-title-line">' + ST.esc(l.title) + '</div>';
      h += '</div><div class="st-row-actions">' + statusBadge(l) +
        '<button type="button" class="st-icon-btn" data-expand-send="' + ST.esc(l.key) + '" aria-expanded="' + open + '" aria-label="展开详情">' +
        '<i class="fas fa-chevron-down act-chev' + (open ? ' act-chev-open' : '') + '"></i></button>' +
        '</div></div>';
      if (open) h += sendDetailHtml(l);
      h += '</div>';
      return h;
    }
    function emptyHtml(kind, title, desc, actions) {
      return '<div class="st-empty st-empty--' + kind + '">' +
        '<div class="st-empty-icon"><i class="fas ' + (kind === 'error' ? 'fa-exclamation-circle' : (kind === 'filter' ? 'fa-filter' : 'fa-paper-plane')) + '"></i></div>' +
        '<div class="st-empty-title">' + ST.esc(title) + '</div>' +
        '<div class="st-empty-desc">' + ST.esc(desc) + '</div>' +
        (actions ? '<div class="st-empty-actions">' + actions + '</div>' : '') +
        '</div>';
    }
    function renderSend() {
      // 摘要行（聚合数字一律注明范围，A29）
      if (!send.loaded && send.loading) {
        els.sendSummary.textContent = '';
        els.sendList.innerHTML = '<div class="st-skel st-skel--row"></div><div class="st-skel st-skel--row"></div><div class="st-skel st-skel--row"></div>';
        els.sendEmpty.innerHTML = '';
        els.sendMore.innerHTML = '';
        return;
      }
      if (send.error) {
        els.sendSummary.textContent = '';
        els.sendList.innerHTML = '';
        els.sendEmpty.innerHTML = emptyHtml('error', '发送记录加载失败', String(send.error.message || send.error),
          '<button type="button" class="st-btn st-btn--primary st-btn--sm" data-action="retry-send">重试</button>');
        els.sendMore.innerHTML = '';
        return;
      }
      var okCount = 0, failCount = 0;
      send.visible.forEach(function (l) { if (l.status === 'failed') failCount++; else okCount++; });
      els.sendSummary.textContent = '当前筛选 · 已加载 ' + send.visible.length + ' 条（成功 ' + okCount + ' · 失败 ' + failCount + '）· 时间范围：' + rangeLabel() + ' · 记录保留 30 天';
      els.sendList.innerHTML = send.visible.map(sendRowHtml).join('');
      if (send.visible.length === 0) {
        if (send.everAny === false && !hasActiveSendFilters()) {
          els.sendEmpty.innerHTML = emptyHtml('blank', '尚无发送记录', '订阅提醒实际发送后，每条结果都会记录在这里；渠道测试也会留下一条测试记录。', '');
        } else {
          els.sendEmpty.innerHTML = emptyHtml('filter', '当前筛选无结果', '换个筛选条件试试，或清除筛选查看全部记录。',
            '<button type="button" class="st-btn st-btn--primary st-btn--sm" data-action="clear-send-filters">清除筛选</button>');
        }
      } else {
        els.sendEmpty.innerHTML = '';
      }
      // 分页区
      var more = '';
      if (send.hasMore) {
        more = '<button type="button" class="st-btn st-btn--ghost" data-action="more-send">加载更多</button>' +
          '<span class="st-caption">已加载 ' + send.visible.length + ' 条 · 还有更多</span>';
      } else if (send.visible.length > 0) {
        more = '<span class="st-caption">已显示全部 ' + send.visible.length + ' 条（' + rangeLabel() + '）' +
          (send.items.length >= SEND_MAX ? ' · 已达单次查询上限 500 条' : '') + '</span>';
      }
      if (send.loading && send.loaded) more = '<span class="st-caption">加载中…</span>' + more;
      els.sendMore.innerHTML = more;
      // 运行窗横幅
      if (send.runWindow) {
        els.runBanner.hidden = false;
        els.runBannerText.textContent = '正在查看 ' + send.runWindow.label + ' 发出的发送记录';
      } else {
        els.runBanner.hidden = true;
      }
    }

    /* ───────── 调度段：结论与渲染 ───────── */
    /* 结论 tone 一律取 ST.schedTone（与状态点/健康卡同源）；文案在其上按计数细化 */
    function schedConclusion(e) {
      var t = ST.schedTone(e);
      var label = t.label;
      if (e.status !== 'error' && e.status !== 'skipped') {
        if (num(e.sentCount) > 0) label = '已发送 ' + num(e.sentCount) + ' 条';
        else if (e.reason && e.reason.indexOf('未启用任何通知渠道') >= 0) label = '渠道未配置';
        else if (num(e.matchedCount) === 0) label = '无到期项';
      }
      return { tone: t.tone, label: label };
    }
    function daysText(d) {
      d = Number(d);
      if (isNaN(d)) return '';
      if (d < 0) return '已过期 ' + Math.abs(d) + ' 天';
      if (d === 0) return '今天到期';
      return d + ' 天后到期';
    }
    function schedDetailHtml(e) {
      var h = '<div class="act-detail" data-detail="' + ST.esc(e.key) + '">';
      var extra = (e.extra && typeof e.extra === 'object') ? e.extra : null;
      var candidates = extra && Array.isArray(extra.candidates) ? extra.candidates : [];
      var channelResults = extra && extra.channelResults && typeof extra.channelResults === 'object' ? extra.channelResults : null;
      if (candidates.length) {
        h += '<div class="act-dlabel">本次命中（' + candidates.length + ' 条规则）</div>';
        candidates.forEach(function (c) {
          ensureRules(c.subId);
          h += '<div class="act-cand"><span class="act-cand-name">' + ST.esc(c.subName || subNameFor({ subId: c.subId })) + '</span>' +
            '<span class="act-cand-meta" data-candrule="' + ST.esc(c.subId) + '|' + ST.esc(c.ruleId) + '|' + ST.esc(c.ruleType) + '|' + num(c.ruleValue) + '">' +
            ST.esc(candidateRuleSummary(c)) + '</span>' +
            (c.daysDiff !== null && c.daysDiff !== undefined ? '<span class="act-cand-meta">' + ST.esc(daysText(c.daysDiff)) + '</span>' : '') +
            '</div>';
        });
      }
      if (channelResults && Object.keys(channelResults).length) {
        h += '<div class="act-dlabel">渠道结果</div><div style="display:flex;flex-wrap:wrap;gap:var(--sp-2);">';
        Object.keys(channelResults).forEach(function (name) {
          h += channelBadge(name) + ' ' + (channelResults[name] ? ST.badge('ok', '成功') : ST.badge('danger', '失败'));
        });
        h += '</div>';
      }
      if (e.reason) h += preBlock('结论说明', e.reason);
      if (extra && extra.stack) h += preBlock('异常堆栈', String(extra.stack), true);
      if (!candidates.length && !channelResults) {
        h += '<div class="st-caption">本次没有发送明细（未命中规则或已全部跳过，计数见上方）。</div>';
      }
      h += '<div class="act-detail-actions">' +
        '<button type="button" class="st-btn st-btn--ghost st-btn--sm" data-run-link="' + ST.esc(e.key) + '">查看该次发送 →</button>' +
        '</div>';
      h += '</div>';
      return h;
    }
    function schedRowHtml(e) {
      var c = schedConclusion(e);
      var open = !!expandedSched[e.key];
      var meta = '命中 ' + num(e.matchedCount) + ' 条 · 发送 ' + num(e.sentCount) + ' 条 · 去重跳过 ' + num(e.dedupedCount) +
        ' · 检查 ' + num(e.checkedCount) + ' 个订阅' + (num(e.autoRenewedCount) > 0 ? ' · 自动续订 ' + num(e.autoRenewedCount) : '');
      var h = '<div class="act-item">';
      h += '<div class="st-row"><div class="st-row-main">';
      h += '<div class="st-row-title">' + ST.esc(ST.fmtDateTimeInTz(e.startedAt)) + ' ' + ST.badge(c.tone, c.label) + '</div>';
      h += '<div class="st-row-meta">' + ST.esc(meta) + '</div>';
      if (e.reason) h += '<div class="st-row-meta">' + ST.esc(e.reason) + '</div>';
      h += '</div><div class="st-row-actions">' +
        '<button type="button" class="st-icon-btn" data-expand-sched="' + ST.esc(e.key) + '" aria-expanded="' + open + '" aria-label="展开详情">' +
        '<i class="fas fa-chevron-down act-chev' + (open ? ' act-chev-open' : '') + '"></i></button>' +
        '</div></div>';
      if (open) h += schedDetailHtml(e);
      h += '</div>';
      return h;
    }
    function loadSched(reset) {
      if (sched.loading) return Promise.resolve();
      if (reset) { sched.limit = SCHED_PAGE; sched.loaded = false; }
      sched.loading = true;
      renderSched();
      var lim = sched.limit;
      return apiGet('/api/scheduler-logs?limit=' + lim).then(function (j) {
        sched.items = (j && j.logs) || [];
        sched.hasMore = sched.items.length >= lim && lim < SCHED_MAX;
        sched.loaded = true;
        sched.error = null;
      }).catch(function (e) {
        sched.error = e;
        sched.loaded = true;
      }).then(function () {
        sched.loading = false;
        renderSched();
      });
    }
    function loadMoreSched() {
      if (sched.loading || !sched.hasMore) return;
      sched.limit = Math.min(SCHED_MAX, sched.limit + SCHED_PAGE);
      loadSched(false);
    }
    function renderSched() {
      if (!sched.loaded && sched.loading) {
        els.schedSummary.textContent = '';
        els.schedList.innerHTML = '<div class="st-skel st-skel--row"></div><div class="st-skel st-skel--row"></div><div class="st-skel st-skel--row"></div>';
        els.schedEmpty.innerHTML = '';
        els.schedMore.innerHTML = '';
        return;
      }
      if (sched.error) {
        els.schedSummary.textContent = '';
        els.schedList.innerHTML = '';
        els.schedEmpty.innerHTML = emptyHtml('error', '调度记录加载失败', String(sched.error.message || sched.error),
          '<button type="button" class="st-btn st-btn--primary st-btn--sm" data-action="retry-sched">重试</button>');
        els.schedMore.innerHTML = '';
        return;
      }
      els.schedSummary.textContent = '调度记录保留 30 天 · 已加载 ' + sched.items.length + ' 条';
      els.schedList.innerHTML = sched.items.map(schedRowHtml).join('');
      if (sched.items.length === 0) {
        els.schedEmpty.innerHTML = '<div class="st-empty st-empty--blank">' +
          '<div class="st-empty-icon"><i class="fas fa-clock"></i></div>' +
          '<div class="st-empty-title">尚无调度记录</div>' +
          '<div class="st-empty-desc">调度器运行后会在这里留下每次检查的结论，记录保留 30 天。</div></div>';
      } else {
        els.schedEmpty.innerHTML = '';
      }
      var more = '';
      if (sched.hasMore) {
        more = '<button type="button" class="st-btn st-btn--ghost" data-action="more-sched">加载更多</button>' +
          '<span class="st-caption">已加载 ' + sched.items.length + ' 条 · 还有更多</span>';
      } else if (sched.items.length > 0) {
        more = '<span class="st-caption">已显示全部 ' + sched.items.length + ' 条（保留期内）</span>';
      }
      if (sched.loading && sched.loaded) more = '<span class="st-caption">加载中…</span>' + more;
      els.schedMore.innerHTML = more;
    }

    /* ───────── 分段切换与调度互链 ───────── */
    function setSeg(seg) {
      activeSeg = seg;
      var btns = document.querySelectorAll('[data-seg]');
      for (var i = 0; i < btns.length; i++) {
        var on = btns[i].getAttribute('data-seg') === seg;
        btns[i].classList.toggle('is-active', on);
        btns[i].setAttribute('aria-selected', on ? 'true' : 'false');
      }
      els.paneSend.hidden = seg !== 'send';
      els.paneSched.hidden = seg !== 'sched';
    }
    function gotoRunSends(entry) {
      send.runWindow = {
        since: entry.startedAt,
        until: entry.finishedAt || entry.startedAt,
        label: ST.fmtDateTimeInTz(entry.startedAt) + ' 的调度'
      };
      send.rule = '';
      setSeg('send');
      loadSend(true);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    function findSchedEntry(key) {
      for (var i = 0; i < sched.items.length; i++) if (sched.items[i].key === key) return sched.items[i];
      return null;
    }
    /* ?run=<ISO>：逐页加载直到找到该次运行并展开 */
    function expandRun(iso) {
      var found = null;
      for (var i = 0; i < sched.items.length; i++) {
        if (sched.items[i].startedAt === iso) { found = sched.items[i]; break; }
      }
      if (found) {
        expandedSched[found.key] = true;
        renderSched();
        var el = els.schedList.querySelector('[data-detail="' + CSS.escape(found.key) + '"]');
        if (el) el.scrollIntoView({ block: 'center' });
        return;
      }
      if (sched.hasMore && !sched.loading) {
        sched.limit = Math.min(SCHED_MAX, sched.limit + SCHED_PAGE);
        loadSched(false).then(function () { expandRun(iso); });
      }
    }

    /* ───────── 筛选 UI 构建与事件 ───────── */
    function buildChannelChips() {
      var h = '<button type="button" class="st-fchip is-active" data-channel="">全部</button>';
      ST.CHANNELS.forEach(function (c) {
        h += '<button type="button" class="st-fchip" data-channel="' + ST.esc(c.name) + '">' + ST.esc(c.label) + '</button>';
      });
      els.channelChips.innerHTML = h;
    }
    function syncChannelChips() {
      var btns = els.channelChips.querySelectorAll('[data-channel]');
      var any = Object.keys(send.channels).length > 0;
      for (var i = 0; i < btns.length; i++) {
        var v = btns[i].getAttribute('data-channel');
        btns[i].classList.toggle('is-active', v === '' ? !any : !!send.channels[v]);
      }
    }
    function syncStatusChips() {
      var btns = els.statusChips.querySelectorAll('[data-status]');
      for (var i = 0; i < btns.length; i++) {
        btns[i].classList.toggle('is-active', btns[i].getAttribute('data-status') === send.status);
      }
    }
    function syncRangeSeg() {
      var btns = els.rangeSeg.querySelectorAll('[data-range]');
      for (var i = 0; i < btns.length; i++) {
        btns[i].classList.toggle('is-active', btns[i].getAttribute('data-range') === send.range);
      }
    }
    function clearSendFilters() {
      send.channels = {}; send.status = ''; send.subId = ''; send.range = '30d';
      send.rule = ''; send.runWindow = null;
      els.filterSub.value = '';
      syncChannelChips(); syncStatusChips(); syncRangeSeg();
      loadSend(true);
    }

    function bindEvents() {
      document.querySelectorAll('[data-seg]').forEach(function (b) {
        b.addEventListener('click', function () { setSeg(b.getAttribute('data-seg')); });
      });
      els.channelChips.addEventListener('click', function (ev) {
        var b = ev.target.closest('[data-channel]');
        if (!b) return;
        var v = b.getAttribute('data-channel');
        if (v === '') send.channels = {};
        else if (send.channels[v]) delete send.channels[v];
        else send.channels[v] = true;
        syncChannelChips();
        loadSend(true);
      });
      els.statusChips.addEventListener('click', function (ev) {
        var b = ev.target.closest('[data-status]');
        if (!b) return;
        send.status = b.getAttribute('data-status') || '';
        syncStatusChips();
        loadSend(true);
      });
      els.rangeSeg.addEventListener('click', function (ev) {
        var b = ev.target.closest('[data-range]');
        if (!b) return;
        send.range = b.getAttribute('data-range') || '30d';
        send.runWindow = null;
        syncRangeSeg();
        loadSend(true);
      });
      els.filterSub.addEventListener('change', function () {
        send.subId = els.filterSub.value || '';
        loadSend(true);
      });
      $('runBannerClear').addEventListener('click', function () {
        send.runWindow = null;
        loadSend(true);
      });
      $('reloadBtn').addEventListener('click', function () {
        if (ST.configError) { location.reload(); return; }
        if (activeSeg === 'send') loadSend(true); else loadSched(true);
        ST.toast('已刷新');
      });

      // 列表区事件委托：展开/收起、分页、空状态动作、互链
      document.addEventListener('click', function (ev) {
        var t;
        if ((t = ev.target.closest('[data-expand-send]'))) {
          var k1 = t.getAttribute('data-expand-send');
          if (expandedSend[k1]) delete expandedSend[k1]; else expandedSend[k1] = true;
          renderSend();
          return;
        }
        if ((t = ev.target.closest('[data-expand-sched]'))) {
          var k2 = t.getAttribute('data-expand-sched');
          if (expandedSched[k2]) delete expandedSched[k2]; else expandedSched[k2] = true;
          renderSched();
          return;
        }
        if ((t = ev.target.closest('[data-run-link]'))) {
          var entry = findSchedEntry(t.getAttribute('data-run-link'));
          if (entry) gotoRunSends(entry);
          return;
        }
        if ((t = ev.target.closest('[data-action]'))) {
          var a = t.getAttribute('data-action');
          if (a === 'more-send') loadMoreSend();
          else if (a === 'more-sched') loadMoreSched();
          else if (a === 'retry-send') loadSend(true);
          else if (a === 'retry-sched') loadSched(true);
          else if (a === 'clear-send-filters') clearSendFilters();
        }
      });

      // 触底加载更多
      if ('IntersectionObserver' in window) {
        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (en) {
            if (!en.isIntersecting) return;
            if (en.target === $('sendSentinel') && activeSeg === 'send') loadMoreSend();
            if (en.target === $('schedSentinel') && activeSeg === 'sched') loadMoreSched();
          });
        }, { rootMargin: '240px' });
        io.observe($('sendSentinel'));
        io.observe($('schedSentinel'));
      }
    }

    /* ───────── 深链入参 ───────── */
    function applyDeepLinks() {
      var sub = qs.get('sub');
      if (sub) send.subId = sub;
      var ch = qs.get('channel');
      if (ch && channelDef(ch)) send.channels[ch] = true;
      var st = qs.get('status');
      if (st === 'success' || st === 'failed' || st === 'test') send.status = st;
      var rule = qs.get('rule');
      if (rule) send.rule = rule;
      syncChannelChips(); syncStatusChips(); syncRangeSeg();
      if (qs.get('run')) setSeg('sched');
    }

    /* ───────── 启动：时区门禁后才渲染任何日期 ───────── */
    (async function init() {
      buildChannelChips();
      bindEvents();
      try {
        await ST.configReady;
      } catch (e) {
        // ST 已显示页级错误横幅（#st-config-error，带重试）；内容区保持骨架，不按 UTC 渲染（A5）
        return;
      }
      $('tzName').textContent = ST.tz();
      applyDeepLinks();
      await loadSubs();
      els.filterSub.value = send.subId || '';
      // 真空判定探针：保留期内是否存在任何发送记录
      apiGet('/api/notification-logs?limit=1').then(function (j) {
        send.everAny = !!((j && j.logs) || []).length;
        if (send.loaded && !send.loading && send.visible.length === 0) renderSend();
      }).catch(function () { send.everAny = null; });
      await Promise.all([loadSend(true), loadSched(true)]);
      var run = qs.get('run');
      if (run) expandRun(run);
    })();
  })();
  </script>
</body>
</html>

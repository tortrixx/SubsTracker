
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>订阅管理系统</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  ${themeResources}  <style>
    /* 登录页：Craft 式环境光底 + 悬浮玻璃卡（功能层玻璃的教科书用法） */
    .login-container {
      min-height: 100vh;
      background-color: #EFF2F7;
      background-image:
        radial-gradient(900px 560px at 12% -8%, rgba(0, 113, 227, 0.20), transparent 60%),
        radial-gradient(820px 520px at 88% 4%, rgba(175, 82, 222, 0.16), transparent 58%),
        radial-gradient(760px 620px at 55% 108%, rgba(48, 176, 199, 0.14), transparent 60%);
      background-attachment: fixed;
    }
    .login-box {
      background: rgba(255, 255, 255, 0.68);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.65);
      border-radius: 20px;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.7),
        0 4px 8px rgba(15, 23, 42, 0.05),
        0 24px 56px rgba(15, 23, 42, 0.16);
    }
    .login-box h1 { letter-spacing: -0.01em; }
    .input-field {
      transition: border-color 0.125s ease, box-shadow 0.125s ease, background-color 0.125s ease;
      border: 1px solid rgba(0, 0, 0, 0.12);
      background: rgba(255, 255, 255, 0.85);
      border-radius: 10px;
    }
    .input-field:focus {
      border-color: #0071E3;
      box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.25);
      outline: none;
    }
    html.dark .login-container {
      background-color: #070D18;
      background-image:
        radial-gradient(900px 560px at 12% -8%, rgba(41, 151, 255, 0.16), transparent 60%),
        radial-gradient(820px 520px at 88% 4%, rgba(175, 82, 222, 0.12), transparent 58%),
        radial-gradient(760px 620px at 55% 108%, rgba(48, 176, 199, 0.10), transparent 60%);
    }
    html.dark .login-box {
      background: rgba(21, 34, 56, 0.72);
      border: 1px solid rgba(226, 232, 240, 0.14);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.10),
        0 4px 8px rgba(0, 0, 0, 0.4),
        0 24px 56px rgba(0, 0, 0, 0.55);
    }
    html.dark .login-box .text-gray-800 { color: #EDF1F7; }
    html.dark .login-box .text-gray-600,
    html.dark .login-box .text-gray-700 { color: #9AA9C2; }
    html.dark .input-field {
      background: rgba(226, 232, 240, 0.07);
      border-color: rgba(226, 232, 240, 0.18);
      color: #EDF1F7;
    }
    @media (prefers-reduced-transparency: reduce) {
      .login-box { -webkit-backdrop-filter: none; backdrop-filter: none; background: #FFFFFF; }
      html.dark .login-box { background: #152238; }
    }
  </style>
</head>
<body class="login-container flex items-center justify-center">
  <div class="login-box p-8 rounded-xl w-full max-w-md">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-gray-800"><i class="fas fa-calendar-check mr-2"></i>订阅管理系统</h1>
      <p class="text-gray-600 mt-2">登录管理您的订阅提醒</p>
    </div>
    
    <form id="loginForm" class="space-y-6">
      <div>
        <label for="username" class="block text-sm font-medium text-gray-700 mb-1">
          <i class="fas fa-user mr-2"></i>用户名
        </label>
        <input type="text" id="username" name="username" required autofocus autocomplete="username"
          class="input-field w-full px-4 py-3 rounded-lg text-gray-700 focus:outline-none">
      </div>
      
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
          <i class="fas fa-lock mr-2"></i>密码
        </label>
        <input type="password" id="password" name="password" required autocomplete="current-password"
          class="input-field w-full px-4 py-3 rounded-lg text-gray-700 focus:outline-none">
      </div>
      
      <button type="submit" 
        class="btn-primary w-full py-3 rounded-lg text-white font-medium focus:outline-none">
        <i class="fas fa-sign-in-alt mr-2"></i>登录
      </button>
      
      <div id="errorMsg" class="text-red-500 text-center" role="alert"></div>
      <p class="text-xs text-amber-700 text-center mt-3 leading-relaxed">
        若仍使用默认账号 <code>admin</code> / <code>password</code>，登录后请立即在「系统配置」修改密码。
      </p>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      
      const button = e.target.querySelector('button');
      const originalContent = button.innerHTML;
      button.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>登录中...';
      button.disabled = true;
      
      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        
        const result = await response.json();
        
        if (result.success) {
          window.location.href = '/admin';
        } else {
          document.getElementById('errorMsg').textContent = result.message || '用户名或密码错误';
          button.innerHTML = originalContent;
          button.disabled = false;
        }
      } catch (error) {
        document.getElementById('errorMsg').textContent = '发生错误，请稍后再试';
        button.innerHTML = originalContent;
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
